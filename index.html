
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

:root {
    --bg: #080d1c;
    --panel: #111a30;
    --panel2: #172440;
    --blue: #54a8ff;
    --cyan: #42e8e0;
    --purple: #a78bfa;
    --pink: #f472b6;
    --orange: #ffb86b;
    --green: #43e6a0;
    --red: #ff7185;
    --text: #eff5ff;
    --muted: #9aaccb;
    --border: rgba(155, 184, 255, .15);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
    scroll-padding-top: 90px;
}

body {
    font-family: 'Inter', sans-serif;
    background:
        radial-gradient(ellipse at 10% 5%, #1d2860 0, transparent 32%),
        radial-gradient(ellipse at 95% 25%, #32185a 0, transparent 30%),
        radial-gradient(ellipse at 50% 90%, #102c42 0, transparent 35%),
        var(--bg);
    color: var(--text);
    line-height: 1.7;
    min-height: 100vh;
}

::selection {
    background: var(--purple);
    color: white;
}

/* PREMIUM HERO */

header {
    position: relative;
    overflow: hidden;
    padding: 75px 7% 65px;
    background:
        linear-gradient(115deg, rgba(15, 26, 65, .98),
        rgba(45, 35, 110, .91), rgba(8, 86, 112, .87));
    border-bottom: 1px solid #8b9fff45;
}

header::before,
header::after {
    content: "";
    position: absolute;
    border-radius: 50%;
    filter: blur(2px);
    pointer-events: none;
}

header::before {
    width: 340px;
    height: 340px;
    right: 5%;
    top: -160px;
    background: #8b5cf633;
    border: 1px solid #c4b5fd40;
    box-shadow: 0 0 100px #8b5cf622;
}

header::after {
    width: 220px;
    height: 220px;
    right: 24%;
    bottom: -170px;
    background: #22d3ee1c;
    border: 1px solid #22d3ee44;
}

.brand {
    color: var(--cyan);
    letter-spacing: 3px;
    font-size: 12px;
    font-weight: 800;
    position: relative;
    z-index: 1;
}

header h1 {
    font-size: clamp(40px, 7vw, 76px);
    line-height: 1.12;
    letter-spacing: -2px;
    margin: 20px 0;
    font-weight: 900;
    position: relative;
    z-index: 1;
}

header h1 span {
    background: linear-gradient(90deg, #65d8ff, #c4a5ff, #ff9ed2);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

header p {
    color: #d3e0ff;
    max-width: 850px;
    font-size: 15px;
    position: relative;
    z-index: 1;
}

.tags {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 26px;
    position: relative;
    z-index: 1;
}

.tag {
    padding: 8px 14px;
    border: 1px solid #a5b4fc45;
    border-radius: 30px;
    background: #ffffff0b;
    backdrop-filter: blur(12px);
    color: #e5eaff;
    font-size: 11px;
    font-weight: 700;
    transition: .25s;
}

.tag:hover {
    background: #8b5cf633;
    border-color: var(--purple);
    transform: translateY(-3px);
}

/* GLASS NAVIGATION */

nav {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    padding: 15px 4%;
    background: rgba(8, 13, 28, .88);
    backdrop-filter: blur(22px);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
}

nav a {
    text-decoration: none;
    color: #b7c6e5;
    font-size: 12px;
    font-weight: 700;
    padding: 8px 12px;
    border-radius: 8px;
    transition: .25s;
}

nav a:hover {
    color: white;
    background: linear-gradient(120deg, #4f46e5, #0e7490);
    box-shadow: 0 0 22px #6366f133;
}

/* MAIN LAYOUT */

main {
    width: min(1400px, 100%);
    margin: auto;
    padding: 45px 28px;
}

.section {
    margin-bottom: 48px;
    scroll-margin-top: 90px;
    animation: fadeIn .65s ease both;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
}

.section-head {
    margin-bottom: 24px;
    position: relative;
}

.eyebrow {
    color: var(--cyan);
    font-size: 10px;
    font-weight: 900;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 7px;
}

h2 {
    color: var(--text);
    font-size: clamp(23px, 3vw, 32px);
    font-weight: 800;
    letter-spacing: -.8px;
    margin: 3px 0 8px;
}

.subtitle {
    color: var(--muted);
    font-size: 13px;
}

/* PREMIUM CARDS */

.grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 18px;
}

.two-col {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 22px;
}

.three-col {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 20px;
}

.card {
    position: relative;
    min-width: 0;
    padding: 25px;
    border: 1px solid var(--border);
    border-radius: 18px;
    background: linear-gradient(145deg, #172440ed, #0f192ceb);
    box-shadow: 0 12px 35px #00000022;
    overflow: hidden;
    transition:
        transform .3s ease,
        border-color .3s ease,
        box-shadow .3s ease;
}

.card:hover {
    transform: translateY(-5px);
    border-color: #8b9fff65;
    box-shadow: 0 18px 45px #00000035, 0 0 25px #8b5cf611;
}

.panel-title {
    font-size: 16px;
    font-weight: 800;
    color: #edf4ff;
    margin-bottom: 8px;
}

.panel-note {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 22px;
}

/* KPI GLOW CARDS */

.kpi {
    --accent: var(--blue);
    background:
        radial-gradient(ellipse at 100% 0%, color-mix(in srgb, var(--accent) 17%, transparent), transparent 65%),
        linear-gradient(145deg, #172440, #0e172b);
    border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
    padding: 24px;
}

.kpi::before {
    content: "";
    position: absolute;
    width: 100px;
    height: 100px;
    top: -52px;
    right: -40px;
    border-radius: 50%;
    border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
    box-shadow: 0 0 35px color-mix(in srgb, var(--accent) 15%, transparent);
}

.kpi::after {
    content: "";
    height: 3px;
    position: absolute;
    bottom: 0;
    left: 12%;
    right: 12%;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
}

.kpi-label {
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 1.2px;
    color: #b9c8e6;
    line-height: 1.7;
}

.kpi-value {
    font-size: clamp(22px, 2.5vw, 31px);
    font-weight: 900;
    letter-spacing: -.7px;
    color: var(--accent);
    margin: 12px 0 9px;
    overflow-wrap: anywhere;
    text-shadow: 0 0 25px color-mix(in srgb, var(--accent) 20%, transparent);
}

.kpi-note {
    font-size: 11px;
    color: #9caed0;
}

/* COLORFUL DATA BARS */

.bar-row {
    margin: 20px 0;
}

.bar-info {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    font-size: 12px;
    color: #c4d1e9;
    margin-bottom: 9px;
}

.bar-info strong {
    color: #f2f6ff;
    white-space: nowrap;
    font-weight: 800;
}

.track {
    height: 10px;
    background: #263450;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: inset 0 2px 5px #00000030;
}

.fill {
    height: 100%;
    width: 0;
    border-radius: 20px;
    background: linear-gradient(90deg, var(--bar, #54a8ff), #a78bfa);
    box-shadow: 0 0 14px color-mix(in srgb, var(--bar, #54a8ff) 38%, transparent);
    animation: growBar 1.2s ease forwards;
}

@keyframes growBar {
    from { width: 0; }
}

/* INSIGHT BOXES */

.note {
    padding: 17px 19px;
    border-radius: 12px;
    border: 1px solid #54a8ff35;
    border-left: 4px solid var(--blue);
    background: linear-gradient(100deg, #2563eb17, #17244080);
    color: #d5e5ff;
    margin-top: 18px;
    font-size: 12px;
}

.note strong { color: #8ed7ff; }

.note.warn {
    background: linear-gradient(100deg, #f9731619, #17244080);
    border-color: #ffb86b40;
    border-left-color: var(--orange);
}

.note.warn strong { color: var(--orange); }

.note.success {
    background: linear-gradient(100deg, #10b98118, #17244080);
    border-color: #43e6a040;
    border-left-color: var(--green);
}

.note.success strong { color: var(--green); }

/* DATA ROWS */

.stat-line {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 14px;
    padding: 13px 0;
    border-bottom: 1px solid #ffffff12;
    color: #b7c6e2;
    font-size: 12px;
}

.stat-line:last-child { border-bottom: none; }

.stat-line strong {
    color: #f0f5ff;
    text-align: right;
    font-weight: 800;
}

/* PROBLEM STATEMENTS */

.ps {
    border-top: 3px solid var(--accent, var(--blue));
    background:
        linear-gradient(160deg, color-mix(in srgb, var(--accent, var(--blue)) 10%, #172440), #101a30 70%);
}

.ps-number {
    font-size: 10px;
    letter-spacing: 1.4px;
    color: var(--accent);
    font-weight: 900;
}

.ps h3 {
    color: #f1f5ff;
    font-size: 16px;
    margin: 12px 0 10px;
    line-height: 1.5;
}

.ps p {
    color: #aabbd8;
    font-size: 12px;
}

.pill {
    display: inline-block;
    border: 1px solid color-mix(in srgb, var(--accent, var(--blue)) 35%, transparent);
    border-radius: 30px;
    padding: 6px 11px;
    margin-top: 15px;
    background: color-mix(in srgb, var(--accent, var(--blue)) 12%, transparent);
    color: var(--accent, var(--blue));
    font-size: 10px;
    font-weight: 800;
}

/* RECOMMENDATIONS */

.recommendation {
    border-top: 3px solid var(--accent);
    background:
        radial-gradient(ellipse at 100% 0%, color-mix(in srgb, var(--accent) 12%, transparent), transparent 60%),
        linear-gradient(145deg, #172440, #0e172b);
}

.priority {
    color: var(--accent);
    font-size: 10px;
    font-weight: 900;
    letter-spacing: 1.3px;
}

.recommendation h3 {
    color: #f1f5ff;
    font-size: 19px;
    line-height: 1.45;
    margin: 13px 0;
}

.recommendation p {
    color: #afbfdb;
    font-size: 12px;
    margin-bottom: 12px;
}

.impact {
    color: var(--accent);
    font-size: 29px;
    font-weight: 900;
    margin-top: 16px;
}

.impact-label {
    color: #a9bad7;
    font-size: 11px;
}

/* TABLE */

.table-wrap {
    overflow-x: auto;
    padding: 0;
}

table {
    width: 100%;
    min-width: 650px;
    border-collapse: collapse;
    font-size: 12px;
}

th {
    background: linear-gradient(100deg, #263b72, #3b3378);
    color: #f3f5ff;
    text-align: left;
    padding: 16px;
    font-weight: 800;
}

td {
    padding: 15px 16px;
    color: #c1cde4;
    border-bottom: 1px solid #ffffff10;
}

tbody tr {
    background: #111c32;
    transition: background .2s;
}

tbody tr:nth-child(even) { background: #15213a; }
tbody tr:hover { background: #24345a; }
tbody tr td:first-child { color: #86d9ff; font-weight: 700; }

/* LISTS */

ul {
    padding-left: 22px;
}

li {
    color: #c4d1e8;
    margin: 10px 0;
    font-size: 13px;
}

li::marker { color: var(--cyan); }

/* FOOTER */

footer {
    padding: 40px 20px;
    text-align: center;
    background: linear-gradient(110deg, #101831, #201b45, #102b3e);
    border-top: 1px solid #8b9fff35;
    color: #9db0d2;
    font-size: 11px;
}

footer strong {
    display: block;
    font-size: 16px;
    color: #f0f5ff;
    margin-bottom: 8px;
}

footer p { margin-top: 6px; }

/* MOBILE RESPONSIVE */

@media (max-width: 1000px) {
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .three-col { grid-template-columns: 1fr; }
}

@media (max-width: 650px) {
    header { padding: 45px 22px; }
    header h1 { letter-spacing: -1px; }
    main { padding: 25px 14px; }
    .grid, .two-col, .three-col { grid-template-columns: 1fr; }
    nav { gap: 5px; padding: 10px 8px; }
    nav a { font-size: 10px; padding: 7px 8px; }
    .card { padding: 20px; }
    .section { margin-bottom: 35px; }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: .01ms !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
    }
}
</style>
